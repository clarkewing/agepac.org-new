version: 2

registries:
  flux-pro:
    type: composer-repository
    url: https://composer.fluxui.dev
    username: ${{secrets.FLUX_USERNAME}}
    password: ${{secrets.FLUX_LICENSE_KEY}}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - flux-pro
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      composer-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      composer-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
      day: "wednesday"
    cooldown:
      default-days: 5
    groups:
      vite:
        patterns:
          - "vite"
          - "laravel-vite-plugin"
          - "@tailwindcss/vite"
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
